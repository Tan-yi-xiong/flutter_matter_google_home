name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  PUB_ENVIRONMENT: flutter_matter_google_home_ci

jobs:
  dart:
    name: Dart analyze and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Read Flutter version
        shell: bash
        run: |
          version="$(jq -r '.flutter // empty' .fvmrc)"
          test -n "${version}"
          echo "FLUTTER_VERSION=${version}" >> "${GITHUB_ENV}"

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - working-directory: example
        run: flutter pub get
      - working-directory: example
        run: flutter test

  android:
    name: Android build and Kotlin tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Read Flutter version
        shell: bash
        run: |
          version="$(jq -r '.flutter // empty' .fvmrc)"
          test -n "${version}"
          echo "FLUTTER_VERSION=${version}" >> "${GITHUB_ENV}"

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Download Google Home Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/google-home-sdk"
          curl -fsSL \
            https://storage.googleapis.com/home_sdk_android/home.android.sdk_1_11_1.zip \
            -o "${RUNNER_TEMP}/google-home-sdk/sdk.zip"
          echo "9154ee88b3d93e7eafb85a1132043e281a14d1f60fc50913a4c230b34afafef4  ${RUNNER_TEMP}/google-home-sdk/sdk.zip" \
            | sha256sum -c -
          unzip -q "${RUNNER_TEMP}/google-home-sdk/sdk.zip" \
            -d "${RUNNER_TEMP}/google-home-sdk/repo"
          echo "GOOGLE_MATTER_SDK_REPO=${RUNNER_TEMP}/google-home-sdk/repo" >> "${GITHUB_ENV}"

      - run: flutter pub get
      - working-directory: example
        run: flutter pub get
      - working-directory: example
        run: flutter build apk --debug
      - name: Verify merged Google Home manifest contract
        working-directory: example
        shell: bash
        run: |
          set -euo pipefail
          manifest="build/app/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml"
          test -f "${manifest}"
          grep -q 'com.google.android.gms.metadata.ModuleDependencies' "${manifest}"
          grep -q 'home:0:preferred' "${manifest}"
          grep -q 'COMMISSION_DEVICE_TO_3P_FABRIC' "${manifest}"
          grep -q 'BIND_COMMISSIONING_SERVICE' "${manifest}"
      - working-directory: example/android
        run: ./gradlew :flutter_matter_google_home:testDebugUnitTest --no-daemon
