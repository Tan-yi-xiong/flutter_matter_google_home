name: flutter_matter_google_home
description: Android Google Home Matter commissioning with optional handoff sessions.
version: 0.1.0-dev.1
homepage: https://github.com/Tan-yi-xiong/flutter_matter_google_home
repository: https://github.com/Tan-yi-xiong/flutter_matter_google_home
issue_tracker: https://github.com/Tan-yi-xiong/flutter_matter_google_home/issues
publish_to: none
topics:
  - matter
  - google-home
  - iot
  - flutter-plugin

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.tyx.flutter_matter_google_home
        pluginClass: FlutterMatterGoogleHomePlugin
