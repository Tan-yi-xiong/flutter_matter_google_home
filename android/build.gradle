group 'com.tyx.flutter_matter_google_home'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.4.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

def googleMatterSdkRepo = providers.gradleProperty('googleMatterSdkRepo')
    .orElse(providers.environmentVariable('GOOGLE_MATTER_SDK_REPO'))
    .orNull

allprojects {
    repositories {
        google()
        mavenCentral()
        if (googleMatterSdkRepo != null) {
            maven { url = uri(googleMatterSdkRepo) }
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    if (project.android.hasProperty('namespace')) {
        namespace 'com.tyx.flutter_matter_google_home'
    }

    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 29
        consumerProguardFiles 'consumer-rules.pro'
    }

    dependencies {
        implementation 'com.google.android.gms:play-services-home:17.1.0'
        implementation 'com.google.android.gms:play-services-home-types:17.1.0'
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
            testLogging {
                events 'passed', 'skipped', 'failed', 'standardOut', 'standardError'
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
}

tasks.register('verifyGoogleMatterSdkRepository') {
    doLast {
        if (googleMatterSdkRepo == null) {
            throw new GradleException(
                'Google Home Android SDK repository is not configured. ' +
                'Download home.android.sdk_1_11_1.zip from Google and set ' +
                '-PgoogleMatterSdkRepo=/absolute/path/to/unzipped/repo or ' +
                'GOOGLE_MATTER_SDK_REPO.'
            )
        }
        if (!file(googleMatterSdkRepo).isDirectory()) {
            throw new GradleException(
                "googleMatterSdkRepo does not exist or is not a directory: ${googleMatterSdkRepo}"
            )
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'preBuild') {
        task.dependsOn tasks.named('verifyGoogleMatterSdkRepository')
    }
}
